name: Scheduled maintenance (free cron)

# El plan Hobby de Vercel permite una sola corrida por día por cron, y eso es lo
# que hacía que un pago cobrado esperara hasta 24 h para acreditarse, que una
# reserva vencida bloqueara stock, y que la reparación de seguridad RWA tardara
# dos días en converger (una corrida agenda el timelock, otra lo aplica).
#
# GitHub Actions cubre eso sin costo: cada job es un curl de segundos. Los
# `crons` de apps/web/vercel.json quedan como red de seguridad diaria; la
# frecuencia real la da este workflow.
#
# Se pega al alias *.vercel.app y no al dominio propio: www.sanovacapital.com
# pasa por Cloudflare, que le tira un "managed challenge" a las IPs de los
# runners y curl no lo puede resolver, así que volvía un 403 opaco sin importar
# el token. El alias resuelve directo al deployment y ahí decide la auth de la app.
#
# Dos límites honestos de GitHub Actions, para no descubrirlos en producción:
#   - los schedules se retrasan bajo carga; no hay garantía de puntualidad
#   - en un repo sin actividad por 60 días GitHub los desactiva y avisa por mail
# Por eso los crons nativos de Vercel se dejan puestos: si esto se apaga, el
# sistema sigue funcionando un día tarde en vez de no funcionar.

# Un solo schedule, y el reparto se decide adentro del job.
#
# Antes había cinco entradas de `cron`, una por grupo de endpoints. Los tres
# schedules poco frecuentes (`25 */2`, `40 */6`, `50 */4`) **no dispararon ni una
# vez** en el primer día: GitHub retrasa los schedules bajo carga y, cuando el
# retraso es grande, descarta la corrida en lugar de encolarla. Los frecuentes
# sobreviven porque tienen seis oportunidades por hora; los de cuatro por día se
# pierden enteros. Así, la reparación de seguridad RWA no corría nunca por acá.
#
# La forma de no depender de eso es pedir una sola frecuencia alta —la que GitHub
# sí entrega— y derivar del reloj qué toca en cada corrida. Las ventanas son de
# una hora entera, no de un minuto: si se cae un tick, otro de la misma hora
# agarra la ventana. Puede haber más de una corrida por ventana, y está bien:
# todos estos endpoints son idempotentes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Endpoint de cron a disparar a mano'
        required: true
        type: choice
        options:
          - watch-awaiting-treasury-usdc
          - process-automation-jobs
          - expire-stale-reservations
          - refresh-borrow-rates
          - index-token-movements
          - sync-deposit-watch

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver qué endpoints toca esta corrida
        id: plan
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.endpoint }}" ]; then
            ENDPOINTS='${{ github.event.inputs.endpoint }}'
            echo "Disparo manual."
          else
            HOUR=$(date -u +%-H)

            # Cada corrida: las dos redes de seguridad donde cada minuto es plata
            # cobrada con tokens sin entregar, o latencia que se suma a todo.
            ENDPOINTS='watch-awaiting-treasury-usdc process-automation-jobs'

            # Cada 2 h: reservas vencidas que bloquean stock que otro compraría.
            if [ $((HOUR % 2)) -eq 0 ]; then
              ENDPOINTS="$ENDPOINTS expire-stale-reservations"
            fi

            # Cada 4 h: reconciliación de movimientos, que no bloquea a nadie.
            if [ $((HOUR % 4)) -eq 0 ]; then
              ENDPOINTS="$ENDPOINTS index-token-movements"
            fi

            # Cada 6 h: reporte y reparación de seguridad RWA, aviso de esquema
            # atrasado, y sincronización del webhook de depósitos. Es el grupo que
            # más lee la cadena, así que no va en cada corrida: la cuota gratuita
            # de Alchemy es finita y esto la consume.
            if [ $((HOUR % 6)) -eq 0 ]; then
              ENDPOINTS="$ENDPOINTS refresh-borrow-rates sync-deposit-watch"
            fi

            echo "Hora UTC $HOUR."
          fi

          echo "endpoints=$ENDPOINTS" >> "$GITHUB_OUTPUT"
          echo "A disparar: $ENDPOINTS"

      - uses: actions/checkout@v4

      # El script mira el cuerpo, no solo el código de estado: estos endpoints
      # devuelven 200 con `ok:false` cuando una etapa se rompe, y así fue como
      # `privyInbound` estuvo caído semanas con el workflow en verde.
      - name: Disparar
        env:
          CRON_EXTERNAL_SECRET: ${{ secrets.CRON_EXTERNAL_SECRET }}
        run: node scripts/ci/ping-cron-endpoint.mjs ${{ steps.plan.outputs.endpoints }}
