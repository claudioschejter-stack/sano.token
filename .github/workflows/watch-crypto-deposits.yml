name: Watch crypto deposits (backup)

# El plan Hobby de Vercel permite una sola corrida de cron por día, pero este
# barrido de respaldo (la detección primaria es el webhook de Alchemy) sirve
# corriendo cada pocos minutos. Usa un secret aparte para no tocar el CRON_SECRET
# del cron nativo de Vercel.
#
# Se pega al alias *.vercel.app y no al dominio propio: www.sanovacapital.com pasa
# por Cloudflare, que le tira un "managed challenge" a las IPs de los runners y
# curl no lo puede resolver, así que volvía un 403 opaco sin importar el token. El
# alias resuelve directo al deployment y ahí decide la auth de la app.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El endpoint devuelve 200 con `ok:false` cuando una de sus etapas se
      # rompe, para no ponerse en rojo por un scan degradado. El costo real de eso
      # fue que `privyInbound` tiró excepción en cada corrida durante semanas
      # —la red de seguridad de los depósitos, muerta— mientras este workflow se
      # veía verde, porque `curl --fail` solo mira el código de estado. El script
      # lee el cuerpo.
      - name: Trigger watch-crypto-deposits endpoint
        env:
          CRON_EXTERNAL_SECRET: ${{ secrets.CRON_EXTERNAL_SECRET }}
        run: node scripts/ci/ping-cron-endpoint.mjs watch-crypto-deposits
